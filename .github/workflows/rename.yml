name: Rename sadeem-website.html to index.html

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with the new light-palette design
        run: |
          git config user.name "ahmed15500"
          git config user.email "ahmed15500@users.noreply.github.com"
          git mv -f sadeem-website.html index.html
          git commit -m "SADEEM website — light color palette"
          git push
